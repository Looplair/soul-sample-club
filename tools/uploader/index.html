<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSC Pack Uploader</title>
<style>
  :root { --bg:#070707; --panel:#111; --line:rgba(255,255,255,.1); --text:#fff; --dim:rgba(255,255,255,.62); --faint:rgba(255,255,255,.4);
          --ok:#5fd38d; --warn:#f2b84b; --bad:#ff6b6b; --accent:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:18px 28px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:15px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; }
  header .sub { color:var(--faint); font-size:13px; }
  header button { margin-left:auto; }
  .wrap { display:grid; grid-template-columns:320px 1fr; min-height:calc(100vh - 62px); }
  aside { border-right:1px solid var(--line); padding:18px 14px; overflow:auto; max-height:calc(100vh - 62px); position:sticky; top:0; }
  .month { margin:18px 10px 8px; font-size:11px; letter-spacing:.18em; color:var(--faint); font-weight:700; }
  .rel { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:1px solid transparent; color:var(--text);
         border-radius:12px; padding:10px 12px; cursor:pointer; font:inherit; }
  .rel:hover { background:rgba(255,255,255,.04); }
  .rel.sel { background:rgba(255,255,255,.07); border-color:var(--line); }
  .rel .n { font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip { font-size:11px; font-weight:700; border-radius:999px; padding:3px 9px; white-space:nowrap; border:1px solid var(--line); color:var(--dim); }
  .chip.live { background:var(--ok); color:#04150b; border-color:transparent; }
  .chip.sched { background:var(--warn); color:#1d1300; border-color:transparent; }
  .chip.draft { color:#fff; border-color:rgba(255,255,255,.35); }
  .chip.ready { color:var(--ok); border-color:rgba(95,211,141,.4); }
  main { padding:28px 36px 80px; max-width:980px; }
  .empty { color:var(--faint); margin-top:80px; text-align:center; }
  .top { display:flex; gap:22px; align-items:flex-start; }
  .top img { width:150px; height:150px; object-fit:cover; border-radius:16px; border:1px solid var(--line); background:#1a1a1a; }
  .top h2 { margin:4px 0 6px; font-size:30px; letter-spacing:-.01em; }
  .muted { color:var(--dim); }
  .faint { color:var(--faint); font-size:13px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px 22px; margin-top:18px; }
  .box h3 { margin:0 0 12px; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); }
  .msg { padding:9px 12px; border-radius:10px; margin:6px 0; font-size:14px; }
  .msg.bad { background:rgba(255,107,107,.12); color:#ffb3b3; }
  .msg.warn { background:rgba(242,184,75,.12); color:#ffd88f; }
  .msg.ok { background:rgba(95,211,141,.12); color:#a9f0c4; }
  .msg.info { background:rgba(255,255,255,.06); color:#fff; }
  label.f { display:block; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin:16px 0 6px; font-weight:700; }
  input[type=text], input[type=date], input[type=time], textarea { width:100%; background:#0a0a0a; border:1px solid rgba(255,255,255,.18); color:#fff;
         border-radius:12px; padding:11px 13px; font:inherit; outline:none; }
  input:focus, textarea:focus { border-color:rgba(255,255,255,.5); }
  textarea { min-height:72px; resize:vertical; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .tags { display:flex; flex-wrap:wrap; gap:7px; }
  .tag { border:1px solid rgba(255,255,255,.2); background:none; color:var(--dim); border-radius:999px; padding:5px 12px; cursor:pointer; font:inherit; font-size:13px; }
  .tag.on { background:#fff; color:#000; border-color:#fff; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; }
  th { color:var(--faint); font-weight:600; font-size:12px; letter-spacing:.1em; text-transform:uppercase; }
  td.num { color:var(--faint); width:28px; }
  .ord button { background:none; border:1px solid var(--line); color:#fff; border-radius:8px; width:28px; height:26px; cursor:pointer; }
  .ord button:disabled { opacity:.25; cursor:default; }
  button.btn { background:#fff; color:#000; border:0; border-radius:14px; padding:14px 22px; font:inherit; font-weight:800; letter-spacing:.06em; text-transform:uppercase; font-size:13px; cursor:pointer; }
  button.btn:disabled { opacity:.4; cursor:default; }
  button.ghost { background:none; color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:12px; padding:9px 16px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
  button.ghost.danger { color:#ffb3b3; border-color:rgba(255,107,107,.4); }
  .radio { display:flex; gap:10px; align-items:center; margin:8px 0; cursor:pointer; }
  .radio input { accent-color:#fff; width:17px; height:17px; }
  .steps { list-style:none; margin:0; padding:0; }
  .steps li { display:flex; align-items:center; gap:10px; padding:6px 0; font-size:14px; border-bottom:1px solid rgba(255,255,255,.05); }
  .steps .ic { width:20px; text-align:center; }
  .steps .lbl { flex:1; }
  .steps .bar { width:160px; height:4px; background:rgba(255,255,255,.1); border-radius:4px; overflow:hidden; }
  .steps .bar i { display:block; height:100%; background:#fff; width:0; }
  .phase { margin:14px 0 4px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:700; }
  .spin { display:inline-block; width:12px; height:12px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:s .8s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  a { color:#fff; }
  .actions { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:22px; }
</style>
</head>
<body>
<header>
  <h1>SSC Pack Uploader</h1>
  <span class="sub">Dropbox → soulsampleclub.com, as a draft, live on your schedule</span>
  <button class="ghost" onclick="loadList()">Refresh</button>
</header>
<div class="wrap">
  <aside id="list"><p class="faint" style="margin:10px">Reading Dropbox…</p></aside>
  <main id="main"><p class="empty">Pick a release on the left.</p></main>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let releases = [], current = null, running = false;

const fmtUTC = (iso) => {
  const d = new Date(iso);
  const utc = d.toLocaleString("en-GB", { timeZone: "UTC", weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  const uk = d.toLocaleString("en-GB", { timeZone: "Europe/London", hour: "2-digit", minute: "2-digit" });
  return `${utc} UTC (${uk} UK)`;
};
const mb = (b) => `${Math.round(b / 1e6)} MB`;

function statusChip(r) {
  const s = r.site;
  if (s?.live) return `<span class="chip live">Live</span>`;
  if (s?.publishAt) return `<span class="chip sched">${new Date(s.publishAt).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" })}</span>`;
  if (s) return `<span class="chip draft">Draft</span>`;
  if (r.trackCount) return `<span class="chip ready">Ready</span>`;
  return `<span class="chip">Empty</span>`;
}

async function loadList() {
  const res = await fetch("/api/releases").then((r) => r.json());
  releases = res.releases;
  let html = "", month = "";
  for (const r of releases) {
    if (r.month !== month) { month = r.month; html += `<div class="month">${esc(month)}</div>`; }
    html += `<button class="rel ${current?.release.dir === r.dir ? "sel" : ""}" data-dir="${esc(r.dir)}"><span class="n">${esc(r.name)}</span>${statusChip(r)}</button>`;
  }
  $("#list").innerHTML = html || `<p class="faint">No releases found.</p>`;
  $("#list").querySelectorAll(".rel").forEach((b) => (b.onclick = () => !running && openRelease(b.dataset.dir)));
}

async function openRelease(dir) {
  $("#main").innerHTML = `<p class="faint">Checking the folder…</p>`;
  current = await fetch(`/api/release?dir=${encodeURIComponent(dir)}`).then((r) => r.json());
  current.order = current.release.tracks.map((t) => t.name);
  const p = current.pack;
  current.form = {
    name: current.release.name,
    description: p?.description || "",
    genres: p?.genres || [],
    styles: p?.styles || [],
    releaseDate: p?.release_date?.slice(0, 10) || current.defaults.releaseDate,
  };
  current.schedOn = !!current.site?.publishAt;
  const at = current.site?.publishAt ? new Date(current.site.publishAt) : null;
  current.goDate = at ? at.toISOString().slice(0, 10) : current.form.releaseDate;
  current.goTime = at ? at.toISOString().slice(11, 16) : "12:00";
  render();
  loadList();
}

function reminders() {
  const r = current.release, f = current.form, out = [];
  if (!f.description.trim()) out.push("Write a short description.");
  if (!f.genres.length && !f.styles.length) out.push("No tags picked yet. Optional, but they help people find it.");
  if (new Date(f.releaseDate + "T12:00:00Z").getUTCDay() !== 5) out.push("The release date isn't a Friday.");
  if (current.schedOn && current.goDate !== f.releaseDate) out.push("The go-live day is different from the release date.");
  return out;
}

function render() {
  if (running) return; // the progress log is live; leave the page alone until it finishes
  const { release: r, site, tags } = current, f = current.form;
  const live = site?.live;
  const tracks = current.order.map((n) => r.tracks.find((t) => t.name === n));
  const tagBtns = (kind) => tags[kind].map((t) => `<button class="tag ${f[kind].includes(t) ? "on" : ""}" data-kind="${kind}" data-tag="${esc(t)}">${esc(t)}</button>`).join("");
  const checks = [
    ...r.blockers.map((m) => `<div class="msg bad">${esc(m)}</div>`),
    ...r.warnings.map((m) => `<div class="msg warn">${esc(m)}</div>`),
    ...reminders().map((m) => `<div class="msg info">${esc(m)}</div>`),
  ];
  const statusLine = live
    ? `<div class="msg ok">Live on the site. <a href="https://www.soulsampleclub.com/packs/${esc(site.slug)}" target="_blank">Open the pack page</a>. Edit it in the admin panel from here on.</div>`
    : site?.publishAt
      ? `<div class="msg warn">Uploaded as a hidden draft. Goes live ${esc(fmtUTC(site.publishAt))}.</div>`
      : site
        ? `<div class="msg info">Uploaded as a hidden draft (${site.tracks} tracks). Not scheduled yet.</div>`
        : "";

  $("#main").innerHTML = `
    <div class="top">
      ${r.cover ? `<img src="/api/file?path=${encodeURIComponent(r.cover.path)}" alt="">` : `<img alt="">`}
      <div style="flex:1">
        <div class="faint">${esc(r.folder)}</div>
        <h2>${esc(r.name)}</h2>
        <div class="muted">${r.tracks.length} tracks · ${mb(r.totalSize)}${r.licence ? " · Pre-Clearance Document" : ""}</div>
        ${statusLine}
      </div>
    </div>

    ${checks.length ? `<div class="box"><h3>Before you go</h3>${checks.join("")}</div>` : `<div class="box"><div class="msg ok">Everything's here: cover, clearance document, ${r.tracks.length} WAVs with BPM and key, and stems for every track.</div></div>`}

    <div class="box">
      <h3>Pack details</h3>
      <label class="f">Name</label><input type="text" id="f-name" value="${esc(f.name)}" ${site ? "disabled" : ""}>
      <label class="f">Description</label><textarea id="f-desc" placeholder="e.g. A foray into a dark selection of cinematic compositions.">${esc(f.description)}</textarea>
      <label class="f">Genres</label><div class="tags">${tagBtns("genres")}</div>
      <label class="f">Styles</label><div class="tags">${tagBtns("styles")}</div>
      <label class="f">Release date</label>
      <div class="row"><input type="date" id="f-date" value="${esc(f.releaseDate)}" style="max-width:200px"><span class="faint">Shown on the pack. Usually the Friday.</span></div>
    </div>

    <div class="box">
      <h3>Tracks (in this order on the site)</h3>
      <table><tr><th></th><th>Name</th><th>BPM</th><th>Key</th><th>Stems</th><th></th></tr>
      ${tracks.map((t, i) => `<tr><td class="num">${i + 1}</td><td><b>${esc(t.name)}</b><div class="faint">${esc(t.file)}</div></td><td>${t.bpm ?? "—"}</td><td>${esc(t.key ?? "—")}</td>
        <td>${t.stemCount ? `${t.stemCount} stems` : `<span style="color:var(--warn)">none</span>`}</td>
        <td class="ord"><button data-mv="${i}" data-d="-1" ${i === 0 ? "disabled" : ""}>↑</button> <button data-mv="${i}" data-d="1" ${i === tracks.length - 1 ? "disabled" : ""}>↓</button></td></tr>`).join("")}
      </table>
    </div>

    <div class="box">
      <h3>Going live</h3>
      <label class="radio"><input type="radio" name="sched" value="draft" ${!current.schedOn ? "checked" : ""}> Keep it as a hidden draft for now</label>
      <label class="radio"><input type="radio" name="sched" value="on" ${current.schedOn ? "checked" : ""}> Go live automatically at</label>
      <div class="row" style="margin-left:27px">
        <input type="date" id="g-date" value="${esc(current.goDate)}" style="max-width:190px" ${!current.schedOn ? "disabled" : ""}>
        <input type="time" id="g-time" value="${esc(current.goTime)}" style="max-width:130px" ${!current.schedOn ? "disabled" : ""}>
        <span class="faint">UTC${current.schedOn ? ` · ${esc(fmtUTC(goISO()))}` : ""}</span>
      </div>
      <p class="faint" style="margin:10px 0 0">It goes live within about 5 minutes of that time, posts the "New pack" notification, and shows up on the homepage and catalog.</p>
      ${site && !live ? `<div class="actions">
        <button class="ghost" id="save-sched">${current.schedOn ? "Save go-live time" : "Remove from schedule"}</button>
        <button class="ghost danger" id="go-now">Put it live now</button></div>` : ""}
    </div>

    <div class="actions">
      <button class="btn" id="go" ${r.blockers.length || live ? "disabled" : ""}>${site ? "Re-run: upload anything missing" : current.schedOn ? "Make files, upload and schedule" : "Make files and upload as draft"}</button>
      <span class="faint">${live ? "Already live." : site ? "Only uploads what isn't there yet, and saves the details above." : "Makes the MP3s and zips in STEM ZIPS + MP3, then uploads everything hidden."}</span>
    </div>
    <div id="progress"></div>`;

  // wiring
  $("#f-name")?.addEventListener("input", (e) => (f.name = e.target.value));
  $("#f-desc").addEventListener("input", (e) => (f.description = e.target.value));
  $("#f-date").addEventListener("change", (e) => { f.releaseDate = e.target.value; if (!current.site?.publishAt) current.goDate = e.target.value; render(); });
  document.querySelectorAll(".tag").forEach((b) => (b.onclick = () => {
    const list = f[b.dataset.kind], t = b.dataset.tag;
    f[b.dataset.kind] = list.includes(t) ? list.filter((x) => x !== t) : [...list, t];
    render();
  }));
  document.querySelectorAll("[data-mv]").forEach((b) => (b.onclick = () => {
    const i = +b.dataset.mv, j = i + +b.dataset.d, o = current.order;
    [o[i], o[j]] = [o[j], o[i]];
    render();
  }));
  document.querySelectorAll("input[name=sched]").forEach((x) => (x.onchange = () => { current.schedOn = x.value === "on" && x.checked; render(); }));
  $("#g-date").addEventListener("change", (e) => { current.goDate = e.target.value; render(); });
  $("#g-time").addEventListener("change", (e) => { current.goTime = e.target.value; render(); });
  $("#go").onclick = go;
  $("#save-sched")?.addEventListener("click", () => schedule(current.schedOn ? goISO() : null));
  $("#go-now")?.addEventListener("click", () => confirm(`Put ${current.release.name} live on the site now?`) && schedule(null, true));
}

const goISO = () => new Date(`${current.goDate}T${current.goTime || "12:00"}:00Z`).toISOString();

async function schedule(publishAt, now = false) {
  const res = await fetch("/api/schedule", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ packId: current.site.id, publishAt, now }) }).then((r) => r.json());
  if (res.error) return alert(res.error);
  if (now && !res.published?.published?.length) alert("Saved, but the site didn't publish it straight away. It'll go live on the next check (within 5 minutes).");
  openRelease(current.release.dir);
}

async function go() {
  if (running) return;
  if (current.schedOn && new Date(goISO()) <= new Date() && !confirm("That go-live time has already passed, so it'll go live as soon as the upload finishes. Carry on?")) return;
  running = true;
  $("#go").disabled = true;
  const prog = $("#progress");
  prog.innerHTML = `<div class="box"><h3>Progress</h3><div id="plog"></div></div>`;
  const plog = $("#plog");
  const rows = {};
  let list = null;
  const res = await fetch("/api/go", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ dir: current.release.dir, details: current.form, order: current.order, publishAt: current.schedOn ? goISO() : null }),
  });
  if (!res.ok) { running = false; const e = await res.json().catch(() => ({})); return alert(e.error || "Couldn't start"); }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const line = buf.slice(0, i); buf = buf.slice(i + 2);
      if (!line.startsWith("data: ")) continue;
      const e = JSON.parse(line.slice(6));
      if (e.phase) { plog.insertAdjacentHTML("beforeend", `<div class="phase">${esc(e.phase)}</div><ul class="steps"></ul>`); list = plog.lastElementChild; continue; }
      if (e.error) { plog.insertAdjacentHTML("beforeend", `<div class="msg bad">Stopped: ${esc(e.error)}<br><span class="faint">Fix it and press the button again. It picks up where it stopped.</span></div>`); continue; }
      if (e.done) {
        plog.insertAdjacentHTML("beforeend", `<div class="msg ok"><b>Done.</b> ${e.schedule ? `Goes live ${esc(fmtUTC(e.schedule.publishAt))}.` : "It's a hidden draft on the site."}
          <a href="${esc(e.admin)}" target="_blank">Open it in the admin panel</a> to check it over.</div>`);
        continue;
      }
      if (!e.step) continue;
      let row = rows[e.step];
      if (!row && list) {
        list.insertAdjacentHTML("beforeend", `<li><span class="ic"></span><span class="lbl">${esc(e.label || e.step)}</span><span class="faint note"></span><span class="bar"><i></i></span></li>`);
        row = rows[e.step] = list.lastElementChild;
      }
      if (!row) continue;
      if (e.status === "run") row.querySelector(".ic").innerHTML = `<span class="spin"></span>`;
      if (e.status === "done") { row.querySelector(".ic").textContent = "✓"; row.querySelector(".bar i").style.width = "100%"; }
      if (e.status === "skip") { row.querySelector(".ic").textContent = "·"; row.querySelector(".bar").style.visibility = "hidden"; }
      if (e.note) row.querySelector(".note").textContent = e.note;
      if (e.progress != null) row.querySelector(".bar i").style.width = `${Math.round(e.progress * 100)}%`;
    }
  }
  running = false;
  await loadList();
  const keep = prog.innerHTML;
  await openRelease(current.release.dir);
  $("#progress").innerHTML = keep;
}

loadList();
</script>
</body>
</html>
