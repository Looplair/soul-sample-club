name: Publish scheduled packs

# Puts Soul Sample Club packs live at their scheduled time (set in the local
# pack uploader). Backup only: Supabase pg_cron calls the route every 5 minutes,
# and GitHub runs this far less often than asked. The site route
# only publishes packs whose time has already passed.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish due packs
        run: curl -fsS --retry 3 --max-time 60 https://www.soulsampleclub.com/api/cron/publish-scheduled-packs
